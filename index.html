<!DOCTYPE html>
<!--
  Combolands Guild Overlap Explorer — pick two guilds, see how they interlock.
  data.js is GENERATED by build-data.mjs (window.CL_DATA); never edit by hand.

  Architecture (see the build-calc-planner house style):
    - Build-first: the home screen IS the comparison (two guild banners flanking
      the tile columns and the shared-overlap centre strip).
    - Selection happens in an OVERLAY opened by clicking a banner (#overlay-root).
    - A second overlay root (#detail-overlay-root) stacks ABOVE for detail pages.
    - Overlays are statically sized; scroll is preserved on every re-render.
    - Functional CATEGORIES are the data-driven, colour-coded "traits" that form
      the overlap surface between guilds.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combolands — Guild Overlap Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The comparison view (build-first home screen) is rendered here by app.js. -->
  <div id="app"></div>

  <!-- Overlay layers, toggled via .hidden.
       #overlay-root        = guild selector (z 100)
       #appendix-root       = searchable index of every detail page (z 150)
       #detail-overlay-root = building/heirloom/counselor/category detail (z 200) -->
  <div id="overlay-root" class="hidden" aria-hidden="true"></div>
  <div id="appendix-root" class="hidden" aria-hidden="true"></div>
  <div id="detail-overlay-root" class="hidden" aria-hidden="true"></div>

  <!-- data.js must load before app.js: it defines window.CL_DATA -->
  <script src="data.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
